      security:
        - token: []
        - oauth2: []
      summary: Set full application configuration
      description:
        Allows to change the configuration and description for your app. Allows setting delivery URLs, services visibility etc.
        To obtain full application information use GET /apps/{appId}/full endpoint.
        Some fields (e.g. publishing state) can only be changed by Fidesmo team in that case they have to be submitted without changes, check the fields descriptions for details.
      parameters:
        - name: appId
          in: path
          description: Application ID
          required: true
          schema:
            type: string
