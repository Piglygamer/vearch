webhooks:
  serviceDescriptionRequest:
    get:
      description:
        Request to check that service exists and available and obtain it's description. Performed before starting the actual delivery.
        The URL is configured for the application.
        Optionally it is possible to specify a list of fields that client application will request from the user before the delivery start.
        Responses will be provided in the service delivery request. Fields are not end-to-end encrypted, for encryption the /userInteraction API
        should be used.
        It is possible to restrict deliveries to certain devices, possible ways to do it is to specify requirements in the service description itself or
        to dynamicly check CIN in the query parameters or client headers and return different status codes to indicate that service is not available for
        the device at the moment. For instance service provider can have multiple public services and dynamically hide them in the application depending on the
        device or client type.
      parameters:
        - name: serviceId
          in: path
          description: Service identifier
          example: "install"
          required: true
          schema:
            type: string
        - name: cin
          in: query
          description: Device identifier. Provided if the service is displayed for a certain device.
          example: "00112233445566"
          schema:
            type: string
        - name: Fidesmo-Client-Description
          in: header
          description: Client description string. Contains information about client type, version, operation system, phone model etc.
          schema:
            type: string
            description: Client description string. Contains information about client type, version, operation system, phone model etc.
            example: "android/31;Fidesmo/1.5.5/1.15.4;Pixel 6"
        - name: Fidesmo-Client-Capabilities
          in: header
          description: List of client capabilities. Capabilities usually defined by the client SDK or detected by the server.
          schema:
            type: array
            description: List of client capabilities. Capabilities usually defined by the client SDK or detected by the server.
            example: [ se-access, payment-aid-access ]
            items:
              type: string
              enum: [ se-access, payment-aid-access, app2app ]
              description: >
                * `se-access` - Indicates that client is able to access SE. For instance not set for Web client.
                * `payment-aid-access` - Indicates that client has access to payment SSDs. As iOS limits it 
                * `app2app` - Client supports a2a authentication
      responses:
        '200':
          description: Service description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescription'
        '404':
          description: Service is not known to the service provider
        '403':
          description: Service is not available for the device at the moment. For instance the device is not in a desired state.
  serviceDeliveryStartedRequest:
    post:
      description: Called when the client initiates the service delivery process. The URL is configured for the application.
        After receiving this request service provider is expected to issue operations that will be run on the chip by API enpoints from the ServiceProvider section
        and passing the sessionId received in this request. After receiving the callback  with the result for operation the next operation can be issued and so on.
        The last operation should be '/service/completed' that indicates that delivery was completed.
      parameters:
        - name: Signature-ES256
          in: header
          description: Request body ES256 signature in JWS (RFC-7515) format - Base64URL(Signature R||S). Public key used to verify the signature
            can be obtained by reading the key id from 'Signature-ES256-Kid' header and obtaining the key using the /certs endpoint. Keys can be cached
          schema:
            type: string
            description: Base64 URL encoded ES256 signature in R||S format of the request body.
            example: "DtEhU3ljbEg8L38VWAfUAqOyKAM6-Xx-F4GawxaepmXFCgfTjDxw5djxLa8ISlSApmWQxfKTUJqPP3-Kg6NU1Q"
        - name: Signature-ES256-Kid
          in: header
          description: Signature key identifier, that can be obtained from /certs endpoint
          schema:
            type: string
            description: Signature key identifier, that can be obtained from /certs endpoint
            example: "key-identifier-1"
      requestBody:
        description: Service delivery request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDeliveryRequest'
      responses:
        '200':
          description: Content is ignored
        '503':
          description: Service provider is not available at the moment
  instanceElementsRequest:
    get:
      description: Optional endpoint that returns information about installed assets on the device for a specified CIN. Usually this information is shown by the client
        when opening application details. Example of such assets are travel tickets that are associated with the device, payment cards, access keys etc.
      parameters:
        - name: cin
          in: path
          description: Device identifier. Provided if the service is displayed for a certain device.
          example: "00112233445566"
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Instance elements response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceElementsResponse'
        '201':
          description: No intance elements are present on the device. Alternative to returning empty list
        '404':
          description: Unknown device
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: JWT token received from /token endpoint
      bearerFormat: jwt
    oauth2:
      type: openIdConnect
      openIdConnectUrl: https://sso.fidesmo.com/auth/realms/public/.well-known/openid-configuration
  schemas:
    TokenRequest:
      oneOf:
        - $ref: "#/components/schemas/UserPassTokenRequest"
        - $ref: "#/components/schemas/ExchangeTokenRequest"
        - $ref: "#/components/schemas/RefreshTokenRequest"
    UserPassTokenRequest:
      type: object
      description: Used to create an access token from username and password. Can be used to create both short lived session tokens or long lived offline tokens.
      required: [username, password]
      properties:
        username:
          type: string
          description: User name
          example: username
        password:
          type: string
          description: User password
          example: password
        accessType:
          type: string
          description: Targeted type of access. Use 'session' or empty for getting a session token and 'offline' for a long lived service token.
          enum: [session, offline]
          example: session
          default: session
        scope:
          type: array
          description: Optional subset of space separated scopes used for token. For session tokens it's a standard list of scopes. Offline tokens support specifying user permissions as scopes to reduce possible permissions set. Should be less or equal to what users account already have. By default uses all available permissions of a user.
          items:
            type: string
          example: "app:11223344 aid:A000000031"
    ExchangeTokenRequest:
      type: object
      description: Used to create an access token from ID token, provided by an external ID provider. This request only allows to create short lived session tokens.
      required: [token, idProvider]
      properties:
        token:
          type: string
          description: ID token obtained from a specified ID service
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IlRlc3QgdG9rZW4iLCJpYXQiOjE1MTYyMzkwMjJ9.PFTm-boW3qFqEArJBgJFBGsVxMNVui_KHEYwu8rokdY'
        idProvider:
          type: string
          description: Identifier of the ID provider
          enum: ['google', 'apple']
          example: google
    RefreshTokenRequest:
      type: object
      description: Used to update refresh token and access token
      required: [refreshToken]
      properties:
        token:
          type: string
          description: Refresh token issued previously
          example: 'e996f86b20ee3cd60f1f608ad772e1c899d115ad'
    TokenResponse:
      type: object
      description: Authentication token response
      properties:
        token:
          type: string
          description: Token that can be used in Authorization header
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IlRlc3QgdG9rZW4iLCJpYXQiOjE1MTYyMzkwMjJ9.PFTm-boW3qFqEArJBgJFBGsVxMNVui_KHEYwu8rokdY"
        tokenType:
          type: string
          enum: [ bearer ]
          description: Token type
    User:
      type: object
      description: User information
      required: [login]
      properties:
        login:
          type: string
          description: Users login
          example: "someone"
        roles:
          type: array
          description: List of user roles if any
          example: ["personalizer"]
          items:
            type: string
        permissions:
          type: array
          description: List of user permissions if any
          example: ["app:11223344", "aid:A00000006170011223344"]
          items:
            type: string
        devices:
          $ref: '#/components/schemas/UserDevicesListSimple'
        devicesDescriptions:
          description: Served instead of 'devices' if request asked for all fields to be include (fields=all)
          $ref: '#/components/schemas/UserDevicesListFull'
      oneOf:
        - required: [devices]
        - required: [devicesDescriptions]
    UserDevicesListSimple:
      type: object
      description: List of user CINs owned by the user
      required: []
      properties:
          type: array
          description: Array of CINs
          items:
            type: string
            description: CIN
          example: [ "00112233445566", "11223344556677" ]
    UserDevicesListFull:
      type: object
      description: List of user devices owned by the user
      $ref: '#/components/schemas/DeviceDescriptionResponse'
    DeviceDescriptionResponse:
      type: object
      required: [cin, iin, description]
      cin:
        type: string
        description: Card Identifier
        example: "00007201010398"
      iin:
        type: string
        description: NOT the issuer number, but an id of the perso bureau
        example : "31045199999906"
      description:
        $ref: '#/components/schemas/DeviceDescription'
      ownedByAccount:
        type: boolean
        description: True if device is owned by any user account
        example: false
    DeviceDescription:
      type: object
      required: [batch, name, capabilities]
      batch:
        $ref: '#/components/schemas/DeviceBatch'
      name:
        $ref: '#/components/schemas/Translations'
      description:
        $ref: '#/components/schemas/Translations'
      siteUrl:
        type: string
        format: uri
        description: Optional URL to a site page dedicated to device
      imageUrl:
        type: string
        format: uri
        description: Optional URL to an device image
      support:
        type: object
        description: Optional support information
        properties:
          supportEmail:
            type: string
            description: Support Email for the device
            example: 'support@issuer.com'
          supportUrl:
            type: string
            description: Support URL for the device
            example: 'https://issuer.com/support'
      capabilities:
        $ref: '#/components/schemas/CardCapabilities'
    DeviceBatch:
      type: object
      required: [batchId, issuer, persoBureauId]
      description: Device batch descriptor
      properties:
        issuer:
          type: number
          format: int64
          description: Device issuer ID
        batchId:
          type: integer
          description: Device batch ID
        issuerName:
          type: string
          description: Device issuer name
          example: 'Samsung'
        persoBureauId:
          type: string
          description: Perso bureau
          example: '999999'
    CardCapabilities:
      description: Device capabilities description
      required: [ platformVersion ]
      properties:
        platformVersion:
          type: number
          format: int64
          description: Fidesmo platform version
        mifareType:
          type: integer
          enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
          description: |
            0 - No MIFARE support <br>
            1 - MIFARE Classic 1K <br>
            2 - MIFARE Classic 4K <br>
            3 - MIFARE DESFire 4K EV1 <br>
            4 - MIFARE DESFire 2K EV1 <br>
            5 - MIFARE DESFire 8K EV1 <br>
            6 - MIFARE Plus 2K <br>
            7 - MIFARE Plus 4K <br>
            8 - MIFARE DESFire 8K EV3 <br>
        uidSize:
          type: integer
          description: |
            0 - 4 Bytes <br>
            1 - 7 Bytes <br>
            2 - 10 Bytes <br>
          enum: [0, 1, 2]
        jcVersion:
          type: integer
          description: JavaCard version. 2 bytes (major, minor) packed into single integer number
        osTypeVersionName:
          type: string
          description: Name of the operation system type used in device.
          example: 'NXP JCOP 5.3'
        globalPlatformVersion:
          type: integer
          description: Global platform version. 2 (major, minor) or 3 (major, minor, patch) bytes version packed into single integer number
        scpVersion:
          type: integer
          description: SCP version used
          enum: [ 2, 3 ]
          example: 2
          default: 2
    CreateDesfireAppRequest:
      type: object
      required: [ aid, amk, keySettings1, keySettings2 ]
      properties:
        aid:
          type: string
          description: The DESFire Application Id to be created(3-bytes length. Value '000000' is not allowed)
          example: '000001'
        amk:
          type: string
          description: The new Application Master Key to be set (16-bytes length in case of 2KTDES/AES and 24-bytes for 3KTDES)
          example: 00112233445566778899AABBCCDDEEFF
        keySettings1:
          type: string
          description: KeySettings 1
          example: 0F
        keySettings2:
          type: string
          description: KeySettings 2
          example: 8D
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
    DeleteDesfireAppRequest:
      type: object
      required: [ aid, amk ]
      properties:
        aid:
          type: string
          description: The DESFire Application Id to be deleted(3-bytes length. Value '000000' is not allowed)
          example: '000001'
        amk:
          type: string
          description: The Application Master Key (16-bytes length in case of 2KTDES/AES and 24-bytes for 3KTDES). It will be used for checking the request performer ownership over the application
          example: 00112233445566778899AABBCCDDEEFF
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
    TransceiveDESFireRequest:
      type: object
      required: [ commands ]
      properties:
        commands:
          type: array
          description: Commands to execute
          example: [ "11223344" ]
          items:
            type: string
        resetSession:
          type: boolean
          description: True if session needs to be reset before sending a commands sequence
          default: false
          example: false
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
    DeliveryProgress:
      type: object
      description: Optional object describing current delivery step and it's position in the total delivery progress
      required: [ currentStep, totalSteps ]
      properties:
        currentStep:
          type: integer
          description: Current delivery step number
        totalSteps:
          type: integer
          description: Total delivery steps number
        message:
          description: Optional delivery step description
          $ref: '#/components/schemas/Translations'
        image:
          type: string
          description: Optional URL to an image describing delivery step
        estimatedDuration:
          type: integer
          description: Estimated step duration in seconds
      example:
        currentStep: 4
        totalSteps: 6
        message: Installing applet
        image: http://imgurl.com/applet-installation.png
        estimatedDuration: 5
    SecurityLevelOption:
      type: object
      description: It allows specifying the SecurityLevel required for running some SecureTransceive operation
      enum: [ NoSecurityLevel(0x00), CMac(0x01), CDecryption(0x02), RMac(0x10), REncryption(0x20), AnyAuthenticated(0x40), Authenticated(0x80) ]
      properties:
        value: Byte representation of the flag
    OperationAccepted:
      type: object
      required: [ operationId ]
      properties:
        operationId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
    OperationSuccess:
      type: object
      required: [ operationId ]
      properties:
        operationId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
        sessionId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
        statusCode:
          type: number
          description: HTTP status code indicating if operation was successful
          example: 200
        operationType:
          type: string
          example: generic
          description: Type of the operation that was performed. Some operations might have additional fields
          enum: [ 'generic', 'transceive', 'user-interaction', 'action', 'desfire', 'uid' ]
    TransceiveSuccess:
      type: object
      required: [ operationId. responses ]
      properties:
        operationId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
        sessionId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
        statusCode:
          type: number
          description: HTTP status code indicating if operation was successful
          example: 200
        responses:
          type: array
          description: List of APDU responses in the same order as commands were sent
          example: [ "9000", "9000" ]
          items:
            type: string
        operationType:
          type: string
          example: generic
          description: Type of the operation that was performed. 'transceive' in this case
          enum: [ 'transceive' ]
    UserInteractionSuccess:
      type: object
      required: [ operationId ]
      properties:
        operationId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
        sessionId:
          type: string
          example: "2787F3F2-CEDA-4BED-9C47-D5A6965A532F"
          description: UUID of the accepted operation
        statusCode:
          type: number
          description: HTTP status code indicating if operation was successful
          example: 200
        operationType:
          type: string
          description: Type of the operation that was performed. 'user-interaction' in this case
          enum: [ 'user-interaction' ]
        ephemeralKey:
          type: string
          description: HEX of ephemeral key used to encrypt fields, encrypted itself by a service description public key. Only present if encryption was requested in operation
        response:
          type: object
          description: A map of field ID and user input. If encryption was requested value is a HEX of encrypted user input
          example: { "fieldId": "User input" }
    Translations:
      type: object
      required: [ id, text ]
      properties:
        id:
          description: Identifier of the message to be shown to the user. It can be used by client apps to build their own messages, as it allows to identify the message intent.
          type: string
          example: "fidesmo-pay.statuses.emailChangeComplete"
        text:
          description: Text of message in the client app language. If no language is set for the client then English is used. The message can include parametrized elements which are set by numbers between curly braces ({0}, {1}, {2}...)
          type: string
          example: "The email address for the wearable has been changed to: {0}"
        params:
          description: Values to replace the parameters in the text with. The first element in the array corresponds with parameter {0}, the second one with parameter {1}, and so forth.
          type: array
          items:
            type: string
            example: "some.mail@some.domain.com"
          example: [some.mail@some.domain.com]
    CcmInstall:
      type: object
      required: [ id, module, application ]
      description: Information needed to register the application on the card and make it selectable.
      properties:
        id:
          description: AID or LFDBH of the CAP file to install (alternatively called ''executableLoadFile''). Type of field is defined by `searchBy` field, but set to AID by default.
          type: string
          example: A00000061700E26B8F120101
        module:
          description: AID of the applet to instantiate (alternatively called ''executableModule'')
          type: string
          example: A00000061700E26B8F120101
        application:
          description: AID of the applet instance created.
          type: string
          example: A00000061700E26B8F120101
        parameters:
          description: 'Install parameters that will be passed to the new instance, encoded as hexadecimal string. Do not include the C9 tag and length.'
          type: string
          example: '01020304'
        searchBy:
          type: string
          description: Indicates how to retrieve (if necessary) the CAP file, based on the ''id'' field
          enum: [ 'aid', 'lfdbh' ]
          example: aid
          default: aid
        extraditeTo:
          $ref: '#/components/schemas/SsdInfo'
        encryptLoad:
          type: boolean
          description: If false it will transfer the load file in clear text while still sending any install parameters encrypted.
          example: false
        selectable:
          type: boolean
          description: indicates if the applet instance will be selectable after installation
          example: true
        araHashes:
          description: List of additional hashes of an app signature (along with Fidesmo Android hash), to be loaded into the Access Control subsystem
          type: array
          items:
            type: string
            description: Additional ARA hash of an app signature (along with Fidesmo Android hash), to be loaded into the Access Control subsystem
            example: 0122334455667788990011223344556677889900
        nfcSelectable:
          type: boolean
          description: flag, to decide if an applet can be accessed through the contactless interface. Only makes sense in eSEs (default true)
          example: true
          default: true
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.
    SsdInfo:
      type: object
      description: identifier of the security domain where the applet instance will be extradited (if necessary)
      properties:
        aid:
          type: string
          description: SSD AID - It might be a Fidesmo-prefixed AID (which ends with appId 4 bytes) or a custom AID
          example: A00000061700E26B81111111
        dapKey:
          type: string
          description: Optional DAP key in case the SSD had DAP Verification enabled.
          example: 00112233445566778899AABBCCDDEEFF
        scpVersion:
          type: number
          description: explicit SCP version supported by the SSD (in case the device has support for multiple versions)
          example: 2
    CcmDelete:
      type: object
      description: Information about the application being deleted.
      required: [ application, withRelated ]
      properties:
        application:
          description: AID of applet instance to delete
          type: string
          example: A00000061700E26B8F120101
        withRelated:
          type: boolean
          example: false
          default: false
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.
    CcmPersonalize:
      type: object
      description: Data and parameters to personalize application
      required: [ application, data ]
      properties:
        application:
          description: AID of applet instance to personalize
          type: string
          example: A00000061700E26B8F120101
        chaining:
          type: string
          description: 'Controls APDU block chaining in P2. If set to ''dataset'' (default) uses global block numbering for whole data, when set to ''tag'' block numbering will be separate for each DGI or TLV'
          enum: [ "tag", "dataset" ]
          example: tag
          default: dataset
        encoding:
          type: string
          description: indicates the structure of the outgoing APDU commands data field (DGI, TLV or other)
          enum: [ "dgi", "tlv", "other" ]
          example: other
          default: other
        decoding:
          type: string
          description: indicates the structure of the incoming data sequence (currently only DGI sequence)
          enum: [ "dgi" ]
          example: dgi
          default: dgi
        blockEncoding:
          type: string
          description: indicates how DGI store data apdus will be generated, either in a standard way or by prefixing length in case of long DGI data
          enum: [ "standard", "extendedLength" ]
          example: standard
          default: standard
        data:
          type: string
          description: Multiple personalization tags as a single HEX string
          example: 7001290104BFFF2049020102030800000000000000FF040A7520000000000000001005046069018006020212800110ED83C91B1F2614EE35DC0305B618CFC58003433041020100301306072A8648CE3D020106082A8648CE3D030107042730250201010420A096F575423FD8C6F33CDFE8D80EC539B938A3E3120EB931AC324B80CD496989
        encrypt:
          type: array
          description: List of tags that have to be encrypted and optional padding parameters
          items:
            $ref: '#/components/schemas/CcmStoreDataEncryptTag'
        applicationSsd:
          description: Optional information about the application SSD in case it's featured by some special trait like custom AID
          $ref: '#/components/schemas/SsdInfo'
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        installForPerso:
          type: string
          enum: [ notSet, install, installNotSelectable ]
          example: notSet
          default: notSet
          description: >
            If set to install, it will use install for perso after authenticating against the applet-associated security domain instead of personalization 
            authenticating against the applet directly and will make applet selectable. The `installNotSelectable` does the same install for perso but without 
            running 'install and make selectable' afterwards (the applet maybe is still selectable if the previous ccm/install op that installed it had the flag `selectable = true`).
        finish:
          type: boolean
          description: flag, to decide if the generated APDUs should have the 0x80 flag set at the end to indicate the end of the command sequence (or not set if false)
          example: true
          default: true
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.
    CcmStoreDataEncryptTag:
      type: object
      required:
        - tag
      properties:
        tag:
          type: string
          description: Tag that has to be encrypted
          example: '8003'
        pad:
          type: boolean
          description: true if encrypted tag also has to be padded
          default: false
          example: true
        zmkEncrypted:
          type: boolean
          description: true if tag is already ZMK encrypted.
          default: false
          example: false
      example:
        - tag: '8001'
          pad: false
        - tag: '8003'
          pad: true
    CcmLoad:
      type: object
      description: Operation to load an ELF from a CAP file already stored in the backend infrastructure
      required:
        - id
      properties:
        id:
          description: Identifier for retrieving the CAP file to load. Either AID or LFDBH or a CAP file, the type of identifier is indicated by the parameter 'searchBy'
          type: string
          example: A00000061702A59F0001
        searchBy:
          description: "Indicates how to retrieve the CAP file: either by the AID ('aid', default) or by the load file hash ('lfdbh')"
          type: string
          enum: [ "aid", "lfdbh" ]
          example: aid
        encrypt:
          description: Indicates if the payload of the operation has to be encrypted. Default is 'true'
          type: boolean
          example: true
        customSsd:
          $ref: "#/components/schemas/SsdInfo"
        progress:
          $ref: "#/components/schemas/DeliveryProgress"
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.
    CcmStoreData:
      type: object
      description: Data and parameters to personalize application
      required: [ application, data, tagType ]
      properties:
        application:
          description: AID of applet instance to personalize
          type: string
          example: A00000061700E26B8F120101
        tagType:
          type: string
          description: 'Optional type of a tag. Only DGI is supported for now.'
          enum:
            - DGI
          example: DGI
        chaining:
          type: string
          description: 'Controls APDU block chaining in P2. If set to ''dataset'' (default) uses global block numbering for whole data, when set to ''tag'' block numbering will be separate for each DGI or TLV'
          enum:
            - tag
            - dataset
          example: tag
          default: dataset
        data:
          type: string
          description: Multiple personalization tags as a single HEX string
          example: 7001290104BFFF2049020102030800000000000000FF040A7520000000000000001005046069018006020212800110ED83C91B1F2614EE35DC0305B618CFC58003433041020100301306072A8648CE3D020106082A8648CE3D030107042730250201010420A096F575423FD8C6F33CDFE8D80EC539B938A3E3120EB931AC324B80CD496989
        encrypt:
          type: array
          description: List of tags that have to be encrypted and optional padding parameters
          items:
            $ref: '#/components/schemas/CcmStoreDataEncryptTag'
        applicationSsd:
          description: Optional information about the application SSD in case it's featured by some special trait like custom AID
          $ref: '#/components/schemas/SsdInfo'
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.  
    Transceive:
      type: object
      description: Specifies a list of APDU commands to be run on SE during delivery
      properties:
        commands:
          description: List of APDU commands
          type: array
          items:
            type: string
            description: APDU command as HEX string
            example: "00A4040000"
        keepOpen:
          description: If set server delivery considers delivery as failed if between two such operations connection to SE was lost
          type: boolean
          default: false
        waitingMessage:
          type: string
          description: Optional message that client may show between operations after this one
          example: "Please wait while server is processing your data"
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.
    SecureTransceiveRequest:
      type: object
      description: Specifies a list of APDU commands to be run securely in an SCP channel to the specified application
      properties:
        application:
          description: Application AID to establish secure channel to before executing commands. It must be present in allowed RIDs list.
          type: string
          example: "A00000061700E26B8F12"
        commands:
          description: List of APDU commands
          type: array
          items:
            type: string
            description: APDU command as HEX string
            example: "00A4040000"
        resetSession:
          description: By default server keeps secure connection open between multiple secure transceive operations. This flag forces server to re-establish the channel.
          type: boolean
          default: false
          example: false
        waitingMessage:
          type: string
          description: Optional message that client can to show between operations after this one
          example: "Please wait while server processing your data"
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        isExtradited:
          type: boolean
          description: Optional boolean. If set to true, it indicates that the applet instance is extradited to a custom SSD and the secure channel will be established to that SSD.
        securityLevel:
          $ref: '#/components/schemas/SecurityLevelOption'
        allowNfcReconnection:
          type: boolean
          description: Optional boolean. If set to true, indicates client that the NFC session can be reset.
    ServiceStatus:
      type: object
      required: [ success, message ]
      properties:
        status:
          type: string
          enum: [ ok, error, cancelled, rejected ]
          description: >
            Indicates delivery status. Used for accounting also impacts the application status after delivery. Supported statuses:
             * `ok` - Delivery succeeded
             * `cancelled` - Delivery cancelled by user
             * `rejected` - Delivery was rejected by service. For instance service is not allowed for the user account.
             * `error` - Other error during delivery
        message:
          description: Text to show to user after delivery finished
          example: "Delivery was successful"
          $ref: '#/components/schemas/Translations'
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        instanceElements:
          type: array
          description: Optional descriptions of components installed on the chip
          items:
            $ref: '#/components/schemas/InstanceElement'
        metadata:
          type: object
          description: Optional key value pairs specific for the service provider that can be used for accounting or support.
          example: { 'provider-id': '12345678' }
        clientMetadata:
          type: object
          description: Optional key value pairs specific for the service provider. Can be used to pass any service specific data to the client.
          example: { 'account-type': 'internal' }
        error:
          type: string
          description: Optional error description that can be used for support or debugging
    InstanceElementsResponse:
      type: object
      required: [ instanceElements ]
      properties:
        instanceElements:
          type: array
          items:
            $ref: '#/components/schemas/InstanceElement'
    InstanceElement:
      type: object
      properties:
        image:
          type: string
          description: Component image URL (for instance credit card image)
        description:
          description: Component description text in Markdown
          $ref: '#/components/schemas/Translations'
      example:
        image: http://imgurl.com/ticket.png
        description: You got 1 Ticket
    UserInteraction:
      anyOf:
        - $ref: '#/components/schemas/UserInteractionFields'
        - $ref: '#/components/schemas/UserInteractionActions'
      example:
        fields:
          - { "label" : "Enter your email", "id" : "text", "type": "edit", "format" : "email" }
    UserInteractionFields:
      type: object
      description: Specifies fields that needs to be shown on the client
      properties:
        fields:
          description: List of fields
          type: array
          items:
            $ref: '#/components/schemas/Field'
        waitingMessage:
          type: string
          description: Optional message that client may show between operations after this one
          example: "Please wait while server is processing your data"
        encrypted:
          type: boolean
          description: If true, forces client to encrypt the fields
          example: false
          default: false
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
    UserInteractionActions:
      type: object
      description: Specifies list of actions to be performed on client
      properties:
        actions:
          description: List of actions
          type: array
          items:
            $ref: '#/components/schemas/UiAction'
        waitingMessage:
          type: string
          description: Optional message that client can to show between operations after this one
          example: "Please wait while server processing your data"
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
    UiAction:
      type: object
      required: [description, name, parameters]
      properties:
        description:
          description: Action description text
          $ref: '#/components/schemas/Translations'
        name:
          type: string
          description: Action name
          enum: [ phonecall, open-android-app ]
        parameters:
          type: object
          description: Generic action parameters
    Field:
      type: object
      required: [ label, id, type ]
      description: UI field for the client shown to the customer before or during delivery. Most of fields require user input,
        but there are read only fields, like `text` or `image` that are used to display information instead.
        Only common field formats are described here, but it could be extended and changed once agreed with client and
        service provider. If a field has multiple values (like `option` field) multiple values should be specified
        in label separated by `\n`.
      properties:
        label:
          description: Label to show along with a field
          $ref: '#/components/schemas/Translations'
        id:
          type: string
          description: Field identifier that client should use to provide users response
          example: "email"
        type:
          type: string
          description: Field type. Specifies how to render the field to the client
          enum:
            - text
            - image
            - paymentcard
            - edit
            - option
        format:
          type: string
          description: Optional field format that helps client to render and validate field. If not supported client, it's supposed to fallback to most generic field
          enum:
            - mastercard
            - maestro
            - visa
            - text
            - number
            - msisdn
            - email
            - button
    App:
      type: object
      description: Application descriptor
      required: [ appId, name, organization, logo, services, installServices ]
      properties:
        appId:
          type: string
          description: Application ID
          example: 34ab5711
        name:
          description: Application name
          allOf:
            - $ref: '#/components/schemas/Translations'
        organization:
          type: object
          description: Organization that owns application
          properties:
            name:
              type: string
              example: ExampleOrg
              description: Organization name
        description:
          $ref: '#/components/schemas/Translations'
        installServices:
          type: array
          description: List of services to install application
          items:
            type: string
            description: Service ID
            example: "install"
        uninstallService:
          type: string
          description: Service ID to uninstall application
          example: "uninstall"
        suspendService:
          type: string
          description: Service ID to suspend application
          example: "suspend"
        unsuspendService:
          type: string
          description: Service ID to unsuspend application
          example: "unsuspend"
        logo:
          type: string
          description: Application logo full URL
          example: http://images.com/logo.svg
        currency:
          type: string
          description: Currency code to use for payment
          example: EUR
        services:
          type: array
          description: Full list of services published for this application
          example: [ "install", "uninstall", "suspend", "unsuspend" ]
          items:
            type: string
            description: Service ID
    StoredApp:
      type: object
      description: Application full descriptor
      required: [ appId, name, organization, logo, services, installServices ]
      properties:
        appId:
          type: string
          description: Application ID
          example: 34ab5711
        name:
          description: Application name
          allOf:
            - $ref: '#/components/schemas/Translations'
        organization:
          type: object
          description: Organization that owns application
          properties:
            name:
              type: string
              description: Organization name
        description:
          $ref: '#/components/schemas/Translations'
        installServices:
          type: array
          description: List of services to install application
          items:
            type: string
            description: Service ID
            example: "install"
        uninstallService:
          type: string
          description: Service ID to uninstall application
          example: "uninstall"
        suspendService:
          type: string
          description: Service ID to suspend application
          example: "suspend"
        unsuspendService:
          type: string
          description: Service ID to unsuspend application
          example: "unsuspend"
        requirements:
          $ref: '#/components/schemas/Requirements'
          description: "Changes application requirements. This is not related to service requirements and only impacts application visibility in published apps list for specific device types"
        logo:
          type: string
          description: Application logo full URL
          example: http://images.com/logo.svg
        services:
          type: array
          description: Full list of services published for this application. Used to display services buttons when opening the application. The application might still have any number of unpublished services available for manual delivery
          example: [ "install", "uninstall", "suspend", "unsuspend" ]
          items:
            type: string
            description: Service ID
        priority:
          type: integer
          default: 1000
          example: 1000
          description: Application priority that defines sorting order in applications list. Can only be changed by Fidesmo administrator accounts.
        serviceDeliveryUri:
          type: string
          example: http://service.com/deliver
          description: URL used to deliver an application service. Uses recipes if not specified
        serviceDescriptionUri:
          type: string
          example: http://service.com/describe
          description: URL used to obtain services description. Uses recipes if not specified
        instanceElementsUri:
          type: string
          example: http://service.com/instance-elements
          description: URL used to obtain application specific instances installed on a specific device
        extraPermissions:
          type: array
          description:
            "By default the application can only access AIDs with prefixes A00000061700XXXXXXXX and A00000061701XXXXXXXX, 
            where XXXXXXXX is the application ID. To access any other AID prefixes or extended platform features an appropriate set of permissions have to be added to this list.
            The format for AID prefix permission is 'aid:A000000617' - that allows to access any AID starting with A000000617.
            Application owner is allowed to add prefixes that are allowed to the owner account itself (can be checked with /user endpoint)"
          example: [ "aid:A000000617", "aid:A000000001", "logicalChannels:1,2" ]
          items:
            type: string
            description: Application permissions
        state:
          type: string
          description:
            Application publishing state in store. Published makes application public, development and
            demo visible only when development mode is on and unpublished apps aren't visible in the applications list.
            Application owner can unpublish the application, but other changes to the application state requires an Fidesmo administator role.
          default: "UNPUBLISHED"
          enum: [ "UNPUBLISHED", "DEMO", "DEVELOPMENT", "PUBLISHED" ]
        metadata:
          type: object
          description: Additional application metadata containing free form settings.
    ServiceDescriptionResponse:
      type: object
      description: Service description response
      required: [ serviceId, description ]
      properties:
        serviceId:
          type: string
          description: Service ID
          example: "install"
        app:
          $ref: '#/components/schemas/App'
        description:
          $ref: '#/components/schemas/ServiceDescription'
    ServiceDescription:
      type: object
      description: Service description
      required: [ title ]
      properties:
        title:
          description: Human readable service name
          $ref: '#/components/schemas/Translations'
        description:
          $ref: '#/components/schemas/Translations'
        confirmationRequired:
          type: boolean
          deprecated: true
        emailRequired:
          description: Set if user have to enter email before delivery, contains translated text that will be shown to user
          allOf:
            - $ref: '#/components/schemas/Translations'
          deprecated: true
        termsAndConditions:
          type: string
          description: URL to terms and conditions that will be shown by the client before service delivery
        msisdnRequired:
          description: Set if user have to enter phone number before delivery, contains translated text that will be shown to user
          allOf:
            - $ref: '#/components/schemas/Translations'
          deprecated: true
        fieldsRequired:
          type: array
          description: List of fields that user will be asked to fill in before delivery started. Results will be sent to service provider in delivery request.
          items:
            $ref: '#/components/schemas/Field'
        requirements:
          $ref: '#/components/schemas/Requirements'
          description: "Sets service requirements. Service delivery will be forbidden for non mathing devices and service will be automatically hidden"
        certificate:
          type: string
          description: Optional certificate with RSA public key in HEX format that can be used to send encrypted fields during delivery
        totalSteps:
          type: integer
          description: Optional total number of delivery steps that allows client to show delivery progress
          example: 4
    ServiceDeliveryRequest:
      type: object
      description: Service delivery request
      required: [ sessionId, serviceId, cardId ]
      properties:
        sessionId:
          type: string
          description: Session ID that has to be passed in headers for all calls outgoing from the service provider
          example: B8410883-FB37-47D8-BB7A-E795C05BA44C
        serviceId:
          type: string
          description: Service ID
          example: install
        cardId:
          type: object
          required: [ cin, iin ]
          properties:
            cin:
              type: string
              description: Fidesmo Device identifier in HEX format (CIN)
              example: "00112233445566"
            iin:
              type: string
              description: Card Issuer identifier number in HEX
              example: "11223344556600"
        fields:
          type: object
          description: Fields requested by `fieldsRequired` in the service description, represented as a map fieldId -> User input
          example: { "accountName": "user123" }
        clientInfo:
          type: object
          required: [description, capabilities]
          properties:
            description:
              type: string
              description: Client description string. Contains information about client type, version, operation system, phone model etc.
              example: "android/31;Fidesmo/1.5.5/1.15.4;Pixel 6"
            capabilities:
              type: array
              description: List of client capabilities. Capabilities usually defined by the client SDK or detected by the server.
              example: [ se-access, payment-aid-access ]
              items:
                type: string
                enum: [ se-access, payment-aid-access, app2app ]
                description: >
                  Sort order:
                  * `se-access` - Indicates that client is able to access SE. For instance not set for Web client.
                  * `payment-aid-access` - Indicates that client has access to payment SSDs. As iOS limits it 
                  * `app2app` - Client supports a2a authentication
            ip:
              type: string
              description: Client IP address
              example: '18.24.13.5'
            languages:
              type: string
              description: Customers preffered language which will be used to communicate with the customer. Format as described in [rfc3282](https://tools.ietf.org/html/rfc3282)
              example: 'fr-CH, fr;q=0.9, en;q=0.8, de;q=0.7, *;q=0.5'
    AppDescription:
      type: object
      description: Application general description
      required: [ name, organization ]
      properties:
        name:
          $ref: '#/components/schemas/Translations'
        organization:
          type: object
          description: Organization that owns application
          properties:
            name:
              type: string
              description: Organization name
        description:
          $ref: '#/components/schemas/Translations'
        installServices:
          type: array
          description: List of services to install application
          items:
            type: string
            description: Service ID
            example: "install"
        uninstallService:
          type: string
          description: Service ID to uninstall application
          example: "uninstall"
        suspendService:
          type: string
          description: Service ID to suspend application
          example: "suspend"
        unsuspendService:
          type: string
          description: Service ID to unsuspend application
          example: "unsuspend"
        requirements:
          $ref: '#/components/schemas/Requirements'
    ServiceRecipe:
      type: object
      description: Service recipe
      required: [ description, successMessage, failureMessage ]
      properties:
        description:
          $ref: '#/components/schemas/ServiceDescription'
        successMessage:
          $ref: '#/components/schemas/Translations'
        failureMessage:
          $ref: '#/components/schemas/Translations'
        serviceCheckUri:
          type: string
          description: Optional validation URL that will be called before recipe delivery (PUT with service delivery request). Any 2xx status means that validation passed.
        serviceResultUri:
          type: string
          description: Optional https or mailto URL that will get a POST request or email with the delivery summary
        actions:
          type: array
          description: List of recipe actions
          items:
            type: object
            properties:
              endpoint:
                type: string
                description: Fidesmo API URL
                example: "/ccm/install"
              content:
                example: {
                  "id": "A00000061700E26B8F12",
                  "module": "A00000061700E26B8F1201",
                  "application": "A00000061700E26B8F120101",
                  "parameters": "01020304",
                  "encryptLoad": false,
                  "progress": {
                    "currentStep": 3,
                    "totalSteps": 5,
                    "message": {
                      "en": "Gathering information",
                      "es": "Extrayendo información"
                    },
                    "image": "https://via.placeholder.com/350x150",
                    "estimatedDuration": 15
                  }
                }
                anyOf:
                  - $ref: '#/components/schemas/CcmInstall'
                  - $ref: '#/components/schemas/CcmLoad'
                  - $ref: '#/components/schemas/CcmPersonalize'
                  - $ref: '#/components/schemas/CcmStoreData'
                  - $ref: '#/components/schemas/UserInteraction'
                  - $ref: '#/components/schemas/SecureTransceiveRequest'
                  - $ref: '#/components/schemas/Transceive'
                  - $ref: '#/components/schemas/DeleteDesfireAppRequest'
                  - $ref: '#/components/schemas/CreateDesfireAppRequest'
                  - $ref: '#/components/schemas/TransceiveDESFireRequest'
    ElfReceiveSuccess:
      type: object
      description: Capfile uploading result
      required: [ executableLoadFile, executableModules, id ]
      properties:
        id:
          type: string
          description: Uploaded file ID (SHA-256 hash)
        executableLoadFile:
          type: string
          description: ELF AID
        executableModules:
          type: array
          description: List of Executable modules AIDs
          items:
            type: string
    CapFileMetadata:
      type: object
      description: CAP file metadata, similar to CapFileResponse but without cap file itself
      required: [ appId, id, elfAid, javaCardVersion, metadata, locationType ]
      properties:
        appId:
          type: string
          description: Application ID
          example: 34ab5711
        id:
          type: string
          description: CAP file identifier
          example: d5d95b581e4b4a90b56c72464fe0e84b4076c79671a745fcb6e9a6086574b01c
        elfAid:
          type: string
          description: ELF file AID
          example: "A00000061700FFFFFFFF"
        javaCardVersion:
          type: string
          description: Java card version
          example: "2.2.2"
        metadata:
          type: object
          description: CAP file metadata provided during upload or derived from CAP itself, GlobalPlatform version, OS Type version, DAP verification signatures etc.
          example: { "gp-version": "2.2", "otv-version": "JCOP 2.4.2r1" }
        locationType:
          type: string
          description: CAP file location, `preloaeded` means that ELF is preloaded on the chip and LOAD commands should be skipped
          enum: [ cap, preloaded ]
    CapFileResponse:
      type: object
      description: Response with CAP file data and metadata
      required: [ appId, id, elfAid, javaCardVersion, metadata, locationType ]
      properties:
        appId:
          type: string
          description: Application ID
          example: 34ab5711
        id:
          type: string
          description: CAP file identifier
          example: d5d95b581e4b4a90b56c72464fe0e84b4076c79671a745fcb6e9a6086574b01c
        elfAid:
          type: string
          description: ELF file AID
          example: "A00000061700FFFFFFFF"
        javaCardVersion:
          type: string
          description: Java card version
          example: "2.2.2"
        metadata:
          type: object
          description: CAP file metadata provided during upload or derived from CAP itself, GlobalPlatform version, OS Type version, DAP verification signatures etc.
          example: { "gp-version": "2.2", "otv-version": "JCOP 2.4.2r1" }
        locationType:
          type: string
          description: CAP file location, `preloaeded` means that ELF is preloaded on the chip and LOAD commands should be skipped
          enum: [ cap, preloaded ]
        data:
          type: string
          description: HEX of CAP file contents. Empty for preloaded CAP files
    ClientReleaseInfo:
      type: object
      description: Information about the client release
      required: [ android, iphone, lastestRelease, version ]
      properties:
        android:
          type: object
          description: Android version of the client
          example: {
            "latestRelease": {
              "version": "2.0.1"
            },
            "latestOptional": {
              "version": "1.8.0",
              "message": {
                "en": "We recommend you update your app.",
                "es": "Te recomendamos actualizar tu aplicación."
              }
            },
            "latestMandatory": {
              "version": "1.0.3",
              "message": {
                "en": "Please update your Fidesmo App.",
                "es": "Por favor, actualiza la aplicación Fidesmo."
              }
            }
          }
        iphone:
          type: object
          description: iOS version of the client
          example: {
            "latestRelease": {
              "version": "3.4.5"
            },
            "latestOptional": {
              "version": "3.2.0",
              "message": {
                "en": "We recommend you update your app!",
                "es": "Te recomendamos actualizar tu aplicación."
              }
            },
            "latestMandatory": {
              "version": "2.12.3",
              "message": {
