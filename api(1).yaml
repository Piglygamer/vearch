openapi: "3.1.0"
info:
  description: Fidesmo API documentation.
  version: "3.0"
  title: Fidesmo API
  contact:
    name: Fidesmo Support
    email: support@fidesmo.com
servers:
  - url: https://api.fidesmo.com/{apiVersion}
    description: Production server
    variables:
      apiVersion:
        enum: ["", v2, v3]
        description: API version, if none is set then v3 is picked.
        default: v3
  - url: https://staging.fidesmo.com/{apiVersion}
    description: Staging server
    variables:
      apiVersion:
        enum: ["", v2, v3]
        description: API version, if none is set then v3 is picked.
        default: v3
paths:
  /token:
    post:
      operationId: createToken
      tags: [ Management ]
      summary: Create user token
      description: Creates a session or a long lived service token for specified user credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: User token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
              example: Invalid request
        '403':
          description: Authorization failed
          content:
            text/plain:
              schema:
                type: string
              example: "Authorization failed"
  /certs:
    get:
      operationId: getCertificates
      tags: [ Management ]
      summary: Returns public certificates
      description: Used to obtain public keys in JSON Web Key format (RFC-7517) used to verify JWT tokens issued by the backend.
      responses:
        '200':
          description: JSON Web Keys list
          content:
            application/json:
              schema:
                type: object
                description: List of JWKs
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [ kty, use, alg, kid ]
                      properties:
                        kty:
                          type: string
                          description: Key Type RSA or EC
                          enum: [RSA, EC]
                          example: EC
                        use:
                          type: string
                          description: Key use. As keys only used to verifying signatures it always set to 'sig'
                          enum: [ sig, enc]
                          example: sig
                        alg:
                          type: string
                          description: Algorithm intended for use with the key
                          example: ES256
                        kid:
                          type: string
                          description: Key identifier used to match specific key
                          example: r2EjfaE0ov6ot7F4i5VJLvdAJ1TnI024
                        x5c:
                          type: array
                          description: X.509 certificate chain. Used for RSA keys
                          items:
                            type: string
                            description: Base64 encoded PKIX certificate
                        x5t:
                          type: string
                          description: X.509 certificate SHA-1 thumbprint
                          example: 13dEKd5QG4STa6Di94Sw6kY
                        n:
                          type: string
                          description: RSA key modulus (only present for RSA keys)
                        e:
                          type: string
                          description: RSA key public exponent (only present for RSA keys)
                        x:
                          type: string
                          description: X coordinate of EC public point (only present for EC keys)
                        y:
                          type: string
                          description: Y coordinate of EC public point (only present for EC keys)
                        crv:
                          type: string
                          description: Curve name (only present for EC keys)
                          example: secp256r1
                example: {"keys":[{"alg":"ES256","crv":"secp256r1","kid":"test-key","kty":"EC","use":"sig","x":"CN2v7W0PyJr8_qWorfB0AJVZYP-IyXoM7fGzjGBU2KY","y":"du1pEdCtpX4uZHnKJUK_hVHSQ3DYCu348gn_sqm3RgI"}]}
        '403':
          description: Authorization failed
          content:
            text/plain:
              schema:
                type: string
              example: Authentication failed
  /user:
    get:
      operationId: getCurrentUser
      tags: [ Management ]
      security:
        - token: []
        - oauth2: []
      summary: Returns current user information
      description: Return current user login, roles and permissions for credentials.
      responses:
        '200':
          description: User credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Authorization failed
          content:
            text/plain:
              schema:
                type: string
              example: Authentication failed
  /client-releases.json:
    get:
      operationId: getClientReleaseInfo
      tags: [ Client ]
      summary: Get client release information
      description: Get information about the latest client release
      responses:
        '200':
          description: CAP files list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientReleaseInfo'
    put:
      operationId: updateClientReleaseInfo
      tags: [ Client ]
      security:
        - credentials: [ ]
        - token: [ ]
        - oauth2: [ fidesmoAdmin ]
      summary: Update client release information
      description: Update information about the latest client release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientReleaseInfo'
      responses:
        '200':
          description: Client release information updated
          content:
            text/plain:
              schema:
                example: "OK"
        '400':
          description: Malformed json file.
          content:
            text/plain:
              schema:
                example: Bad request
        '401':
          description: No authentication of the user
          content:
            text/plain:
              schema:
                example: Unauthorized
        '403':
          description: User has no authorization to access the resource
          content:
            text/plain:
              schema:
                example: Forbidden
  /desfire/ev1/createApp:
    post:
      operationId: createdDesfireApp
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      summary: Create a MIFARE DESFire EV1 application
      description: Create a DESFire EV1 application with the designated ID and Application Master Key (AMK). All other application keys are set to default value. Operation will fail if the application already exists or there is no enough space in the device. Fidesmo does not keep any copy of the AMK. It is the sole responsibility of the creator of the application to keep the AMK safe.
      parameters:
        - in: header
          name: callbackUrl
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - in: header
          name: sessionId
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered
          schema:
            type: string
          required: true
      requestBody:
        required: true
        description: Data required for creating the DESFire application (see schema doc for more info)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDesfireAppRequest'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unprocessable Entity
          content:
            text/plain:
              schema:
                type: string
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /desfire/ev1/deleteApp:
    post:
      operationId: deleteDesfireApp
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      summary: Delete a MIFARE DESFire EV1 application
      description: Delete the DESFire EV1 application with the given ID. To ensure that the requester is the owner of the application the AMK must also be included in the request. Its validity is verified by running an AES authentication against the application. If that authentication is not successful the operation will fail.
      parameters:
        - name: callbackUrl
          in: header
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - name: sessionId
          in: header
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: true
      requestBody:
        required: true
        description: Data required for deleting the DESFire application (see schema doc for more info)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDesfireAppRequest'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unprocessable Entity
          content:
            text/plain:
              schema:
                type: string
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /desfire/ev1/transceive:
    post:
      operationId: desfireTransceive
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      summary: Send a sequence of APDU commands to a DESFire application
      description: Sends the specified commands to a DESFire EV1 application with the given ID
      parameters:
        - name: callbackUrl
          in: header
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - name: sessionId
          in: header
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: true
      requestBody:
        required: true
        description: Data required for deleting the DESFire application (see schema doc for more info)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransceiveDESFireRequest'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unprocessable Entity
          content:
            text/plain:
              schema:
                type: string
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/TransceiveSuccess'
              responses:
                '200':
                  description: Content is ignored
  /ccm/install:
    post:
      operationId: ccmInstall
      summary: Install application to card
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: <p>Create an application instance on a card from an executable load file previously uploaded to Fidesmo.</p><p>The result of the operation is sent via the operation''s callbackUrl. It''s either a success (status code 200) or a failure (any other status code).
      parameters:
        - in: header
          name: callbackUrl
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - in: header
          name: sessionId
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: false
      requestBody:
        required: true
        description: 'Information needed to register the application on the card and make it selectable. It is possible to submit install parameters, but they must come without the ''C9'' tag and length. You can also optionally set ''encryptLoad'' to false, this will transfer the load file in clear text while still sending any install parameters encrypted. An optional progress parameter can be specified to indicate the progress made so far in the service delivery process.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CcmInstall'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /ccm/delete:
    post:
      operationId: ccmDelete
      summary: Delete application from a card
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: Deletes an application from the card
      parameters:
        - in: header
          name: callbackUrl
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - in: header
          name: sessionId
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: false
      requestBody:
        required: true
        description: Information to identify the application that shall be removed from
          the card. The withRelated property is used when deleting an ELF from
          the card. If it is set to true all applet instances related to the
          ELF will also be deleted. This is useful if the AID of your instance
          is not generated by Fidesmo and therefore can not be deleted
          directly. An optional progress parameter can be specified to
          indicate the progress made so far in the service delivery process.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CcmDelete'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /ccm/load:
    post:
      operationId: ccmLoad
      summary: Load application to card
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: Load into a card an executable load file that has been previously uploaded to Fidesmo
      parameters:
        - in: header
          name: callbackUrl
          description: URL that will be called with the result of this operation as the
            body of the HTTP request
          schema:
            type: string
          required: true
        - in: header
          name: sessionId
          description: The session identifier of an ongoing Service Delivery session. This
            marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: false
      requestBody:
        required: true
        description: Information about the software package being loaded
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CcmLoad'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /ccm/personalize:
    post:
      operationId: ccmPersonalize
      summary: Personalize non-extradited application securely with the specified data
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: Personalize a non-extradited application instance on a card using provided tags.
      parameters:
        - in: header
          name: callbackUrl
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - in: header
          name: sessionId
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: false
      requestBody:
        required: true
        description: Data used to personalize an application coming as Hex form of a byte array with TLV or DGI tags that should be sent to the application. Specified AID has to belong to the Fidesmo application.
          Additionally it is possible to specify encryption and padding parameters for each Tag. An optional progress parameter can be specified to indicate the progress made so far in the service delivery process.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CcmPersonalize'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /ccm/storedata:
    post:
      operationId: ccmStoreData
      summary: Personalize application securely with the specified data
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: Personalize an application instance on a card using provided tags
      parameters:
        - in: header
          name: callbackUrl
          description: URL that will be called with the result of this operation as the body of the HTTP request
          schema:
            type: string
          required: true
        - in: header
          name: sessionId
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          schema:
            type: string
          required: false
      requestBody:
        required: true
        description: Data used to personalize an application coming as Hex form of a byte array with TLV or DGI tags that should be sent to the application. Specified AID has to belong to the Fidesmo application.
          Additionally it is possible to specify encryption and padding parameters for each Tag. An optional progress parameter can be specified to indicate the progress made so far in the service delivery process.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CcmStoreData'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OperationSuccess'
              responses:
                '200':
                  description: Content is ignored
  /transceive:
    post:
      operationId: transceive
      summary: Send a sequence of Command APDUs
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: <p>Prepares a sequence of Command APDUs to be sent to a secure
        element.</p><p>The commands are sent in the same order as they are
        received and will be transferred in a single batch to the secure
        element. Each command is processed in order regardless of error codes
        until all commands are processed. The responses from the card will be
        sent via the operation's callbackUrl.
      parameters:
        - in: header
          name: callbackUrl
          schema:
            type: string
          description: URL that will be called with the result of this operation as the body of the HTTP request
          required: true
        - in: header
          name: sessionId
          schema:
            type: string
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          required: false
      requestBody:
        required: true
        description: 'List of APDU commands'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transceive'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/TransceiveSuccess'
              responses:
                '200':
                  description: Content is ignored
  /secure-transceive:
    post:
      operationId: secureTransceive
      summary: Send a sequence of Command APDUs in a secure session
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: "<p>Establishes a Secure connection to a specified application and
        sends a sequence of Command APDUs to a secure element in it.</p><p>The
        commands are encrypted with a session key and authenticated, security
        level is <code>C_DECRYPTION</code> and <code>C_MAC</code>. Each command
        is processed in order they received regardless of error codes until all
        commands are processed. Established secure connection will be reused for
        subsequent operation calls in the same session, unless \"resetSession\"
        is set to true or application AID is changed.</p> See `TransceiveSuccess` object for callback format."
      parameters:
        - in: header
          name: callbackUrl
          schema:
            type: string
          description: URL that will be called with the result of this operation as the body of the HTTP request
          required: true
        - in: header
          name: sessionId
          schema:
            type: string
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          required: false
      requestBody:
        required: true
        description: Application AID to connect to and array of unencrypted Command
          APDUs that will be encrypted and sent to the card. Each command is
          represented by a hexadecimal encoded string. Put the data into a
          JSON encoded array as the 'commands' property. Specified AID has to
          belong to the Fidesmo application. An optional progress parameter
          can be specified to indicate the progress made so far in the service
          delivery process.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureTransceiveRequest'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/TransceiveSuccess'
              responses:
                '200':
                  description: Content is ignored
  /userInteraction:
    post:
      operationId: userInteraction
      summary: Prompt an interaction to the user during service delivery
      tags: [ ServiceProvider ]
      security:
        - token: []
        - oauth2: []
      description: Requests a UI form to be shown on the client side during the delivery process or triggers predefined UI actions. Service provider specifies list of fields to request from user and should expect a callback with filled results. Server doesn't validate presence of all requested fields and their format, so this has to be done on the service provider. Optionally fields can be encrypted on the
        client side by the certificate provided by the Service Provider in the service description.
      parameters:
        - in: header
          name: callbackUrl
          schema:
            type: string
          description: URL that will be called with the result of this operation as the body of the HTTP request
          required: true
        - in: header
          name: sessionId
          schema:
            type: string
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          required: false
      requestBody:
        required: true
        description: Array of fields and UI actions that will be shown to the user. An optional progress parameter can be specified to indicate the progress made so far in the service delivery process.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInteraction'
      responses:
        '200':
          description: Operation accepted. The operation itself is performed asynchronously and the result is sent via the operation's callbackUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
      callbacks:
        OperationComplete:
          '{$request.header.callbackUrl}':
            post:
              requestBody:
                description: Operation completed
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/UserInteractionSuccess'
              responses:
                '200':
                  description: Content is ignored
  /service/completed:
    post:
      operationId: completeDelivery
      tags: [ ServiceProvider ]
      summary: Complete delivery of a service
      description: This method is used to inform Fidesmo that a service was successfully delivered. If this endpoint is not called, the service delivery will time out and will be considered failed.
      security:
        - token: []
        - oauth2: []
      parameters:
        - name: sessionId
          in: header
          description: The session identifier of an ongoing Service Delivery session. This marks this operation as a part of the service being delivered.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceStatus'
      responses:
        '200':
          description: Delivery completed
  /apps:
    get:
      operationId: listApplications
      tags: [ Management ]
      summary: Get a list of apps which offer public services
      description: Return applications list for a specific client and device
      parameters:
        - name: cin
          in: query
          description: Device CIN. Allows to show applications available only for that device
          required: false
          schema:
            type: string
        - name: devicePresent
          in: query
          description: True if client is able to perform operations on device (default). Allows to hide applications that cannot be delivered without device
          required: false
          schema:
            type: boolean
        - name: fields
          in: query
          description: If set to `all` response will contain a list of application description objects, otherwise only application IDs will be returned
          required: false
          example: all
          schema:
