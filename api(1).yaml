              }
            }
          }
    Requirements:
      type: object
      description: Requirements that device should satisfy in order to perform a successful service delivery
      properties:
        fixedUid:
          type: string
          default: any
          description: Device required to use UIDs of scecified size
          enum: [ 4byte, 7byte, 10byte, any ]
          example: "7byte"
        mifare:
          type: string
          description: Device required to support a particular MIFARE type
          default: any
          enum: [ unsupported, classic1k, classic4k, desfire4k, desfire2k, desfire8k, plus2k, plus4k, any ]
          example: "desfire4k"
        issuerAccountIds:
          type: array
          items:
            type: number
            format: int64
            description: Limits delivery to a specific issuer account if set
          example: [ 2445581126465, 2445581126466 ]
        batchId:
          type: array
          description: Limits delivery to a specific set of batches if set
          items:
            type: integer
          example: [ 10, 56 ]
        forbiddenBatchId:
          type: array
          description: Forbids delivery for a specific set of batches if set
          items:
            type: integer
          example: [ 10, 56 ]
        deviceRequired:
          type: boolean
          description: Indicates that this service cannot be delivered without device
          example: true
